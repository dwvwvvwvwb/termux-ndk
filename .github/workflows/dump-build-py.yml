name: Dump build.py for inspection
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "${HOME}/.bin" >> $GITHUB_PATH

      - name: Init & sync llvm_android only
        run: |
          mkdir -p /tmp/ndk-src && cd /tmp/ndk-src
          repo init -u https://android.googlesource.com/platform/manifest \
            -b ndk-r28b --partial-clone --depth=1
          repo sync -c -j$(nproc) toolchain/llvm_android

      - name: Clone termux-ndk patches
        run: git clone --depth=1 https://github.com/lzhiyong/termux-ndk.git /tmp/termux-ndk

      - name: Apply llvm_android patches
        run: |
          cd /tmp/ndk-src/toolchain/llvm_android
          for p in /tmp/termux-ndk/patches/llvm_android/*.patch; do
            echo "=== applying $p ==="
            git apply "$p" || echo "FAILED: $p"
          done

      - name: Dump build.py help & key files
        run: |
          mkdir -p /tmp/dump
          cd /tmp/ndk-src/toolchain/llvm_android
          # 1) 尝试 --help，失败也把错误留下来
          python3 build.py --help > /tmp/dump/help.txt 2>&1 || true
          # 2) 把关键文件拷出来
          cp build.py /tmp/dump/ 2>/dev/null || true
          cp README.md /tmp/dump/ 2>/dev/null || true
          cp -r builders /tmp/dump/ 2>/dev/null || true
          cp -r configs /tmp/dump/ 2>/dev/null || true
          cp paths.py /tmp/dump/ 2>/dev/null || true
          # 3) 把 patches 也带上，方便对照
          cp -r /tmp/termux-ndk/patches/llvm_android /tmp/dump/patches-llvm_android
          # 4) 记录目录结构
          find . -maxdepth 2 -type f -name "*.py" | sort > /tmp/dump/file-list.txt

      - uses: actions/upload-artifact@v4
        with:
          name: build-py-dump
          path: /tmp/dump
          compression-level: 9
