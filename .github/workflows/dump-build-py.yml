name: Dump build.py for inspection
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "${HOME}/.bin" >> $GITHUB_PATH

      - name: Init & sync LLVM toolchain source
        run: |
          mkdir -p /tmp/llvm-src && cd /tmp/llvm-src
          repo init -u https://android.googlesource.com/platform/manifest \
            -b llvm-toolchain --partial-clone --depth=1
          repo sync -c -j$(nproc) --no-tags --optimized-fetch

      - name: Locate build.py & llvm dirs
        run: |
          echo "=== toolchain dir ==="
          ls -la /tmp/llvm-src/toolchain
          echo "=== find build.py ==="
          find /tmp/llvm-src -maxdepth 5 -name "build.py" -not -path "*/out/*" 2>/dev/null
          echo "=== repo list llvm ==="
          cd /tmp/llvm-src && repo list 2>/dev/null | grep -i llvm || true


      - name: Inspect llvm_android layout
        run: |
          cd /tmp/llvm-src/toolchain/llvm_android
          echo "=== root ==="
          ls -la
          echo "=== find the patched files ==="
          find . -maxdepth 3 \( -name "base_builders.py" -o -name "builders.py" -o -name "configs.py" -o -name "paths.py" \) 2>/dev/null
          echo "=== git log (recent) ==="
          git log --oneline -5

      - name: Apply llvm_android patches (remap to src/llvm_android/)
        run: |
          cd /tmp/llvm-src/toolchain/llvm_android
          mkdir -p /tmp/patched
          for p in ${{ github.workspace }}/patches/llvm_android/*.patch; do
            f=$(basename "$p")
            # 把 toolchain/llvm_android/xxx.py 映射到 toolchain/llvm_android/src/llvm_android/xxx.py
            sed -E 's#toolchain/llvm_android/(base_builders|builders|configs|paths)\.py#toolchain/llvm_android/src/llvm_android/\1.py#g' \
              "$p" > "/tmp/patched/$f"
            echo "=== applying $f ==="
            # 现在前缀是 toolchain/llvm_android/src/llvm_android/，-p4 剥掉
            git apply -p4 --whitespace=nowarn "/tmp/patched/$f" || echo "FAILED: $f"
          done

      - name: Dump build.py help & key files
        run: |
          mkdir -p /tmp/dump
          cd /tmp/llvm-src/toolchain/llvm_android
          python3 build.py --help > /tmp/dump/help.txt 2>&1 || true
          cp build.py /tmp/dump/ 2>/dev/null || true
          cp README.md /tmp/dump/ 2>/dev/null || true
          cp -r builders /tmp/dump/ 2>/dev/null || true
          cp -r configs /tmp/dump/ 2>/dev/null || true
          cp paths.py /tmp/dump/ 2>/dev/null || true
          cp -r ${{ github.workspace }}/patches/llvm_android /tmp/dump/patches-llvm_android
          find . -maxdepth 2 -type f -name "*.py" | sort > /tmp/dump/file-list.txt

      - uses: actions/upload-artifact@v4
        with:
          name: build-py-dump
          path: /tmp/dump
          compression-level: 9
