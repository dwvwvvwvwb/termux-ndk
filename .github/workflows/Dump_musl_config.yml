name: Dump musl config
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "${HOME}/.bin" >> $GITHUB_PATH

      - name: Init & sync LLVM toolchain
        run: |
          mkdir -p /tmp/llvm-src && cd /tmp/llvm-src
          repo init -u https://android.googlesource.com/platform/manifest \
            -b llvm-toolchain --partial-clone --depth=1
          repo sync -c -j$(nproc) --no-tags --optimized-fetch

      - name: Dump musl config & preset
        run: |
          cd /tmp/llvm-src/toolchain/llvm_android
          echo "########## build.py (thin wrapper) ##########"
          cat build.py

          echo ""
          echo "########## class LinuxMuslConfig ##########"
          grep -n -A 50 "class LinuxMuslConfig" src/llvm_android/configs.py || echo "NOT FOUND"

          echo ""
          echo "########## preset musl in do_build.py ##########"
          grep -n -B 5 -A 30 "musl" do_build.py | head -120 || echo "NOT FOUND"

          echo ""
          echo "########## hosts.Arch enum ##########"
          grep -n -A 30 "class Arch" src/llvm_android/hosts.py || echo "NOT FOUND"

          echo ""
          echo "########## static link flags in configs/builders ##########"
          grep -rn "static" src/llvm_android/configs.py src/llvm_android/base_builders.py | head -40 || true

          echo ""
          echo "########## preset definitions ##########"
          grep -rn "preset" do_build.py | head -30 || true

      - name: Diagnose with full history
        run: |
          cd /tmp/llvm-src/toolchain/llvm_android
          # 1) 补全历史（--depth=1 的后果）
          git fetch --unshallow origin 2>/dev/null || git fetch --depth=2000 origin 2>/dev/null || true

          echo "===== A. Recent 60 commits ====="
          git log --oneline | head -60

          echo ""
          echo "===== B. grep 530567 in messages / diffs ====="
          git log --all --oneline --grep="530567" | head
          git log --all -S "530567" --oneline | head

          echo ""
          echo "===== D. clang version definition ====="
          grep -rn "CLANG_VERSION_MAJOR" src/llvm_android/ | head -5
          find . -maxdepth 3 \( -name "clang-version" -o -name "clang_version*" -o -name "version.txt" \) 2>/dev/null
          cat src/llvm_android/clang-version 2>/dev/null || true
          cat clang-version 2>/dev/null || true

          echo ""
          echo "===== E. Apply patches with --3way ====="
          mkdir -p /tmp/patched
          for p in ${{ github.workspace }}/patches/llvm_android/*.patch; do
            f=$(basename "$p")
            sed -E 's#toolchain/llvm_android/(base_builders|builders|configs|paths)\.py#toolchain/llvm_android/src/llvm_android/\1.py#g' \
              "$p" > "/tmp/patched/$f"
            echo "--- $f ---"
            git apply --3way -p3 --whitespace=nowarn "/tmp/patched/$f" 2>&1 | head -8 || true
          done

          echo ""
          echo "===== F. Conflict markers ====="
          grep -rn "<<<<<<<" src/llvm_android/ | head -30 || echo "no conflicts"

      - name: Save dump to artifact
        run: |
          cd /tmp/llvm-src/toolchain/llvm_android
          mkdir -p /tmp/diag
          {
            echo "########## build.py ##########"
            cat build.py
            echo ""
            echo "########## LinuxMuslConfig ##########"
            grep -n -A 50 "class LinuxMuslConfig" src/llvm_android/configs.py
            echo ""
            echo "########## musl refs in do_build.py ##########"
            grep -n -B 5 -A 30 "musl" do_build.py
            echo ""
            echo "########## hosts.Arch ##########"
            grep -n -A 30 "class Arch" src/llvm_android/hosts.py
            echo ""
            echo "########## static flags ##########"
            grep -rn "static" src/llvm_android/configs.py src/llvm_android/base_builders.py
          } > /tmp/diag/musl.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: musl-dump
          path: /tmp/diag
          compression-level: 9
